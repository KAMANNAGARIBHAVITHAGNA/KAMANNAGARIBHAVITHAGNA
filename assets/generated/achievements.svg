<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
      
  <defs>
    <!-- Gradients for Premium Look -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    text {
      font-family: 'Press Start 2P', cursive;
      fill: #F8FAFC;
    }
    
    .title { font-size: 20px; fill: #FBBF24; letter-spacing: 2px; }
    .subtitle { font-size: 10px; fill: #94A3B8; }
    .label { font-size: 8px; fill: #38BDF8; }
    .value { font-size: 16px; fill: #F8FAFC; }
    .value-huge { font-size: 32px; fill: #F8FAFC; }
    
    .panel { fill: url(#panelGrad); stroke: #334155; stroke-width: 2px; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    
    .animate-pulse { animation: pulse 2s infinite; }
    .animate-dash { animation: dash 1s linear infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
  </style>

      <rect width="1000" height="200" fill="#0B1121" />
      
  <g transform="translate(20, 20)">
    <rect width="960" height="160" class="panel" rx="4" />
    <rect x="2" y="2" width="956" height="156" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" rx="2" />
    
      <rect x="10" y="-8" width="272" height="16" fill="#0B1121" />
      <text x="20" y="2" font-size="10" fill="#FBBF24">[ ACHIEVEMENTS UNLOCKED ]</text>
    
  </g>

      
      <g transform="translate(120, 90)">
        <path d="M -30 0 L 30 0 L 20 40 L -20 40 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" filter="url(#glowGold)" />
        <path d="M -20 40 L 20 40 L 10 50 L -10 50 Z" fill="#D97706" />
        
        <rect x="-60" y="60" width="120" height="20" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="0" y="74" class="label" text-anchor="middle">AI ENGINEER</text>
      </g>
    
      <g transform="translate(340, 90)">
        <path d="M -30 0 L 30 0 L 20 40 L -20 40 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" filter="url(#glowGold)" />
        <path d="M -20 40 L 20 40 L 10 50 L -10 50 Z" fill="#D97706" />
        
        <rect x="-60" y="60" width="120" height="20" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="0" y="74" class="label" text-anchor="middle">FULL STACK DEV</text>
      </g>
    
      <g transform="translate(560, 90)">
        <path d="M -30 0 L 30 0 L 20 40 L -20 40 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" filter="url(#glowGold)" />
        <path d="M -20 40 L 20 40 L 10 50 L -10 50 Z" fill="#D97706" />
        
        <rect x="-60" y="60" width="120" height="20" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="0" y="74" class="label" text-anchor="middle">OPEN SOURCE</text>
      </g>
    
      <g transform="translate(780, 90)">
        <path d="M -30 0 L 30 0 L 20 40 L -20 40 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" filter="url(#glowGold)" />
        <path d="M -20 40 L 20 40 L 10 50 L -10 50 Z" fill="#D97706" />
        
        <rect x="-60" y="60" width="120" height="20" fill="#020617" stroke="#334155" stroke-width="1" />
        <text x="0" y="74" class="label" text-anchor="middle">GOOGLE GENAI</text>
      </g>
    
    </svg>