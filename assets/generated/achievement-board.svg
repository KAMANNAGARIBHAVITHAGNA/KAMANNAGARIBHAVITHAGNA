<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
      
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', monospace;
      fill: #FFFFFF;
    }
    .title {
      font-size: 24px;
      fill: #FF6B35;
    }
    .subtitle {
      font-size: 14px;
      fill: #FFB703;
    }
    .stat-label {
      font-size: 10px;
      fill: #94A3B8;
    }
    .stat-value {
      font-size: 16px;
      fill: #06D6A0;
    }
    
    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes slideBg {
      from { background-position: 0 0; }
      to { background-position: 100% 0; }
    }
    
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-pulse { animation: pulse 2s steps(2, start) infinite; }
  </style>

      <rect width="800" height="260" fill="#0B1020" />
      
      <rect x="20" y="20" width="760" height="220" fill="#111827" stroke="#334155" stroke-width="4" />
      
      <text x="400" y="60" class="pixel-text title" text-anchor="middle" fill="#FFB703">ACHIEVEMENTS UNLOCKED</text>
      
      
      <rect x="50" y="100" width="320" height="50" fill="#0B1020" stroke="#334155" stroke-width="2" />
      <circle cx="75" cy="125" r="10" fill="#06D6A0" stroke="#334155" stroke-width="2" />
      <text x="95" y="120" class="pixel-text" font-size="10" fill="#FFFFFF">Google Cert</text>
      <text x="95" y="135" class="pixel-text stat-label">Professional Data Engineer</text>
    
      <rect x="410" y="100" width="320" height="50" fill="#0B1020" stroke="#334155" stroke-width="2" />
      <circle cx="435" cy="125" r="10" fill="#06D6A0" stroke="#334155" stroke-width="2" />
      <text x="455" y="120" class="pixel-text" font-size="10" fill="#FFFFFF">15+ Projects</text>
      <text x="455" y="135" class="pixel-text stat-label">Full Stack Built</text>
    
      <rect x="50" y="160" width="320" height="50" fill="#0B1020" stroke="#334155" stroke-width="2" />
      <circle cx="75" cy="185" r="10" fill="#06D6A0" stroke="#334155" stroke-width="2" />
      <text x="95" y="180" class="pixel-text" font-size="10" fill="#FFFFFF">Hackathon</text>
      <text x="95" y="195" class="pixel-text stat-label">3x Winner</text>
    
      <rect x="410" y="160" width="320" height="50" fill="#0B1020" stroke="#334155" stroke-width="2" />
      <circle cx="435" cy="185" r="10" fill="#06D6A0" stroke="#334155" stroke-width="2" />
      <text x="455" y="180" class="pixel-text" font-size="10" fill="#FFFFFF">Open Source</text>
      <text x="455" y="195" class="pixel-text stat-label">50+ PRs Merged</text>
    
