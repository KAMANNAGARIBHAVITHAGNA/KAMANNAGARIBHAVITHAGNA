<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
      
  
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    
    <!-- Stormy Sky Gradient -->
    <linearGradient id="stormGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    
    <!-- Grass Gradient -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>

    <!-- Wood Texture Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Stone Gradient -->
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&amp;display=swap');
    
    text {
      font-family: 'Lilita One', sans-serif;
    }
    
    .hud-text {
      fill: #ffffff;
      font-size: 18px;
      paint-order: stroke;
      stroke: #000000;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .title-text {
      fill: #ffffff;
      font-size: 40px;
      paint-order: stroke;
      stroke: #000000;
      stroke-width: 8px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    
    @keyframes birdHover {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    
    @keyframes bossHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes lightning {
      0%, 95%, 100% { opacity: 0; }
      96%, 98% { opacity: 1; }
      97% { opacity: 0.5; }
    }
    
    @keyframes alertBlink {
      0%, 100% { fill: #ef4444; opacity: 0.8; }
      50% { fill: #fca5a5; opacity: 0.2; }
    }

    .animate-cloud { animation: cloudDrift 40s linear infinite; }
    .animate-bird { animation: birdHover 2s ease-in-out infinite; }
    .animate-boss { animation: bossHover 3s ease-in-out infinite; }
    .animate-lightning { animation: lightning 5s infinite; }
    .animate-alert { animation: alertBlink 1s infinite; }
  </style>

      <rect width="800" height="200" fill="url(#stoneGrad)" />
      
      <!-- Wood Shelf -->
      <rect x="0" y="120" width="800" height="40" fill="url(#woodGrad)" stroke="#78350f" stroke-width="4" filter="url(#dropShadow)" />
      
      <text x="400" y="50" class="title-text" text-anchor="middle">TROPHY ROOM</text>

      
          <g transform="translate(120, 55)">
            <path d="M -25 0 Q -40 0 -30 20 Q -20 30 0 30 L 0 60 L -20 60 L 20 60 L 0 60 L 0 30 Q 20 30 30 20 Q 40 0 25 0 Z" fill="url(#woodGrad)" stroke="#78350f" stroke-width="2" filter="url(#dropShadow)" />
                    <path d="M -25 0 Q -40 0 -30 20 Q -20 30 0 30 L 0 60 L -20 60 L 20 60 L 0 60 L 0 30 Q 20 30 30 20 Q 40 0 25 0 Z" fill="#fbbf24" transform="scale(0.9) translate(0, -5)" />
            <rect x="-60" y="80" width="120" height="20" rx="2" fill="#1e293b" />
            <text y="94" class="hud-text" font-size="12" text-anchor="middle">AI Engineer</text>
          </g>
        
          <g transform="translate(300, 55)">
            <path d="M -10 -40 L 10 -40 L 20 0 L -20 0 Z" fill="#ef4444" filter="url(#dropShadow)" />
                    <circle cx="0" cy="15" r="25" fill="#fbbf24" stroke="#b45309" stroke-width="4" filter="url(#dropShadow)" />
            <rect x="-60" y="80" width="120" height="20" rx="2" fill="#1e293b" />
            <text y="94" class="hud-text" font-size="12" text-anchor="middle">Full Stack</text>
          </g>
        
          <g transform="translate(480, 55)">
            <path d="M -20 -10 L 20 -10 L 30 10 L 0 40 L -30 10 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="4" filter="url(#dropShadow)" />
            <rect x="-60" y="80" width="120" height="20" rx="2" fill="#1e293b" />
            <text y="94" class="hud-text" font-size="12" text-anchor="middle">Open Source</text>
          </g>
        
          <g transform="translate(660, 55)">
            <path d="M -25 0 Q -40 0 -30 20 Q -20 30 0 30 L 0 60 L -20 60 L 20 60 L 0 60 L 0 30 Q 20 30 30 20 Q 40 0 25 0 Z" fill="url(#woodGrad)" stroke="#78350f" stroke-width="2" filter="url(#dropShadow)" />
                    <path d="M -25 0 Q -40 0 -30 20 Q -20 30 0 30 L 0 60 L -20 60 L 20 60 L 0 60 L 0 30 Q 20 30 30 20 Q 40 0 25 0 Z" fill="#fbbf24" transform="scale(0.9) translate(0, -5)" />
            <rect x="-60" y="80" width="120" height="20" rx="2" fill="#1e293b" />
            <text y="94" class="hud-text" font-size="12" text-anchor="middle">GenAI Proj</text>
          </g>
        
    </svg>