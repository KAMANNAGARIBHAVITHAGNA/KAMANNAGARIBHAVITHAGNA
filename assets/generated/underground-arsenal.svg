        <animateTransform attributeName="transform" type="translate" values="581.7330394863944,300; 581.7330394863944,285; 581.7330394863944,300" dur="2s" begin="0.8999999999999999s" repeatCount="indefinite" additive="sum"/>
        <polygon points="0,-20 20,0 0,20 -20,0" fill="#38bdf8" stroke="#0284c7" stroke-width="3">
          <animate attributeName="fill" values="#38bdf8; #7dd3fc; #38bdf8" dur="2s" repeatCount="indefinite" />
        </polygon>
        <text x="0" y="40" font-size="14" fill="#fff" text-anchor="middle" font-family="monospace">TYPESCRIPT</text>
      </g>
    
      <g transform="translate(708.9719108227498, 200)" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="708.9719108227498,200; 708.9719108227498,185; 708.9719108227498,200" dur="2s" begin="1.2s" repeatCount="indefinite" additive="sum"/>
        <polygon points="0,-20 20,0 0,20 -20,0" fill="#38bdf8" stroke="#0284c7" stroke-width="3">
          <animate attributeName="fill" values="#38bdf8; #7dd3fc; #38bdf8" dur="2s" repeatCount="indefinite" />
        </polygon>
        <text x="0" y="40" font-size="14" fill="#fff" text-anchor="middle" font-family="monospace">GEN-AI</text>
      </g>
    
      <g transform="translate(863.1012410232298, 300)" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="863.1012410232298,300; 863.1012410232298,285; 863.1012410232298,300" dur="2s" begin="1.5s" repeatCount="indefinite" additive="sum"/>
        <polygon points="0,-20 20,0 0,20 -20,0" fill="#38bdf8" stroke="#0284c7" stroke-width="3">
          <animate attributeName="fill" values="#38bdf8; #7dd3fc; #38bdf8" dur="2s" repeatCount="indefinite" />
        </polygon>
        <text x="0" y="40" font-size="14" fill="#fff" text-anchor="middle" font-family="monospace">TENSORFLOW</text>
      </g>
    
      <g transform="translate(973.9338240702633, 200)" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="translate" values="973.9338240702633,200; 973.9338240702633,185; 973.9338240702633,200" dur="2s" begin="1.7999999999999998s" repeatCount="indefinite" additive="sum"/>
        <polygon points="0,-20 20,0 0,20 -20,0" fill="#38bdf8" stroke="#0284c7" stroke-width="3">
