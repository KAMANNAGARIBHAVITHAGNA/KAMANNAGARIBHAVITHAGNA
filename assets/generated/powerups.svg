<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
      
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;display=swap');
    
    .game-text {
      font-family: 'Luckiest Guy', cursive;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    
    .hud-text {
      font-family: 'Luckiest Guy', cursive;
      fill: #ffffff;
      font-size: 16px;
      text-shadow: 2px 2px 0 #000;
    }
    
    .title-text {
      font-family: 'Luckiest Guy', cursive;
      font-size: 32px;
      fill: #ffffff;
      text-shadow: 3px 3px 0 #000;
    }

    @keyframes cloudMove {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }
    
    @keyframes birdBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.02); }
    }
    
    @keyframes bugJiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    
    @keyframes siren {
      0%, 100% { fill: #ef4444; opacity: 0.8; }
      50% { fill: #fca5a5; opacity: 0.2; }
    }
    
    .animate-cloud { animation: cloudMove 20s linear infinite; }
    .animate-bird { animation: birdBounce 2s ease-in-out infinite; transform-origin: center; }
    .animate-bug { animation: bugJiggle 1s ease-in-out infinite; transform-origin: center; }
    .animate-siren { animation: siren 1s infinite; }
  </style>

      
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="250" fill="url(#skyGrad)" />
  

      
  <rect x="0" y="200" width="800" height="50" fill="#65a30d" />
  <rect x="0" y="200" width="800" height="15" fill="#a3e635" />
  <!-- Grass tufts -->
  <path d="M 50 200 L 55 190 L 60 200 Z" fill="#a3e635" />
  <path d="M 150 200 L 155 185 L 165 200 Z" fill="#a3e635" />
  <path d="M 450 200 L 460 188 L 465 200 Z" fill="#a3e635" />
  <path d="M 700 200 L 705 192 L 710 200 Z" fill="#a3e635" />

      
      <text x="400" y="50" class="title-text" text-anchor="middle">SKILL BIRDS</text>
      
      
      <g transform="translate(150, 150)">
        <!-- Podium -->
        <rect x="-30" y="30" width="60" height="20" fill="#d97706" stroke="#92400e" stroke-width="3" />
        
        <g class="animate-bird" style="animation-delay: 0s">
          <circle cx="0" cy="0" r="25" fill="#3b82f6" />
               <circle cx="0" cy="10" r="15" fill="#93c5fd" />
          <!-- Generic Eyes -->
          <circle cx="-8" cy="-5" r="5" fill="white" />
          <circle cx="8" cy="-5" r="5" fill="white" />
          <circle cx="-7" cy="-5" r="2" fill="black" />
          <circle cx="9" cy="-5" r="2" fill="black" />
          <path d="M -5 5 L 5 5 L 0 12 Z" fill="#fbbf24" />
        </g>
        
        <text y="75" class="hud-text" text-anchor="middle" font-size="14">PYTHON</text>
      </g>
    
      <g transform="translate(310, 150)">
