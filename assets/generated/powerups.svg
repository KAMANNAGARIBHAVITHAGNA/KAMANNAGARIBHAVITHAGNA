        <g class="animate-bird" style="animation-delay: 0.6000000000000001s">
          <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#10b981" />
               <rect x="-15" y="-5" width="30" height="25" rx="5" fill="#6ee7b7" />
          <!-- Generic Eyes -->
          <circle cx="-8" cy="-5" r="5" fill="white" />
          <circle cx="8" cy="-5" r="5" fill="white" />
          <circle cx="-7" cy="-5" r="2" fill="black" />
          <circle cx="9" cy="-5" r="2" fill="black" />
          <path d="M -5 5 L 5 5 L 0 12 Z" fill="#fbbf24" />
        </g>
        
        <text y="75" class="hud-text" text-anchor="middle" font-size="14">FASTAPI</text>
