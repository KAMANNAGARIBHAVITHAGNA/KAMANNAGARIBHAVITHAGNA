        <rect x="-30" y="30" width="60" height="20" fill="#d97706" stroke="#92400e" stroke-width="3" />
        
        <g class="animate-bird" style="animation-delay: 0.2s">
          <path d="M 0 -25 L 25 20 L -25 20 Z" fill="#f59e0b" />
               <path d="M 0 0 L 15 20 L -15 20 Z" fill="#fde68a" />
          <!-- Generic Eyes -->
          <circle cx="-8" cy="-5" r="5" fill="white" />
          <circle cx="8" cy="-5" r="5" fill="white" />
          <circle cx="-7" cy="-5" r="2" fill="black" />
          <circle cx="9" cy="-5" r="2" fill="black" />
          <path d="M -5 5 L 5 5 L 0 12 Z" fill="#fbbf24" />
        </g>
        
        <text y="75" class="hud-text" text-anchor="middle" font-size="14">ML</text>
      </g>
    
      <g transform="translate(470, 150)">
        <!-- Podium -->
        <rect x="-30" y="30" width="60" height="20" fill="#d97706" stroke="#92400e" stroke-width="3" />
        
        <g class="animate-bird" style="animation-delay: 0.4s">
          <circle cx="0" cy="0" r="25" fill="#06b6d4" />
               <circle cx="0" cy="10" r="15" fill="#67e8f9" />
          <!-- Generic Eyes -->
          <circle cx="-8" cy="-5" r="5" fill="white" />
          <circle cx="8" cy="-5" r="5" fill="white" />
          <circle cx="-7" cy="-5" r="2" fill="black" />
          <circle cx="9" cy="-5" r="2" fill="black" />
          <path d="M -5 5 L 5 5 L 0 12 Z" fill="#fbbf24" />
        </g>
        
