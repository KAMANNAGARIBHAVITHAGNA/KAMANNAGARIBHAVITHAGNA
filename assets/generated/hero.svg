<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
      
  <defs>
    <!-- Gradients for Premium Look -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    text {
      font-family: 'Press Start 2P', cursive;
      fill: #F8FAFC;
    }
    
    .title { font-size: 20px; fill: #FBBF24; letter-spacing: 2px; }
    .subtitle { font-size: 10px; fill: #94A3B8; }
    .label { font-size: 8px; fill: #38BDF8; }
    .value { font-size: 16px; fill: #F8FAFC; }
    .value-huge { font-size: 32px; fill: #F8FAFC; }
    
    .panel { fill: url(#panelGrad); stroke: #334155; stroke-width: 2px; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    
    .animate-pulse { animation: pulse 2s infinite; }
    .animate-dash { animation: dash 1s linear infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
  </style>

      <rect width="1000" height="300" fill="#0B1121" />
      
      <!-- Grid Background -->
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
      </pattern>
      <rect width="1000" height="300" fill="url(#grid)" />

      <!-- Cinematic Title -->
      <text x="500" y="50" class="title" text-anchor="middle" filter="url(#glowGold)">ANGRY DEV</text>
      <text x="500" y="70" class="subtitle" text-anchor="middle">DEVELOPER VS BUGS: PRODUCTION DEPLOYMENT</text>
      
      <!-- Scene Bounds -->
      <rect x="20" y="90" width="960" height="190" fill="none" stroke="#334155" stroke-width="2" />
      <rect x="22" y="92" width="956" height="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />

      <!-- High Tech Slingshot -->
      <g transform="translate(150, 200)">
        <path d="M -10 60 L -10 0 L -30 -30 M -10 0 L 10 -30" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linecap="square" />
        <path d="M -10 60 L -10 0 L -30 -30 M -10 0 L 10 -30" fill="none" stroke="#38BDF8" stroke-width="2" />
        <!-- Energy Band -->
        <path d="M -30 -30 L -80 -10 L 10 -30" fill="none" stroke="#38BDF8" stroke-width="2" filter="url(#glowBlue)" />
      </g>

      <!-- Mascot -->
      
  <g transform="translate(70, 190)" class="animate-float">
    <!-- Core Sphere -->
    <circle cx="0" cy="0" r="15" fill="url(#blueGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#glowBlue)" />
    <!-- Visor -->
    <rect x="-10" y="-4" width="20" height="6" rx="2" fill="#000" />
    <rect x="-6" y="-2" width="12" height="2" fill="#38BDF8" class="animate-pulse" />
    <!-- Energy Rings -->
    <path d="M -25 0 A 25 10 0 0 0 25 0" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,2" />
  </g>


      <!-- Trajectory Arc -->
      <path d="M 90 190 Q 300 50 650 180" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="10,10" class="animate-dash" opacity="0.6" />
      
      <!-- Target Fortress -->
      
  <g transform="translate(750, 150)">
    <!-- Server Rack Bases -->
    <rect x="0" y="60" width="160" height="40" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <rect x="10" y="0" width="40" height="60" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <rect x="110" y="20" width="40" height="40" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    
    <!-- Code Blocks / DB Cylinders -->
    <path d="M 60 40 L 100 40 L 100 60 L 60 60 Z" fill="#334155" stroke="#38BDF8" stroke-width="2" />
    <ellipse cx="80" cy="40" rx="20" ry="5" fill="#475569" stroke="#38BDF8" stroke-width="2" />
    
    <!-- Lights -->
    <circle cx="20" cy="15" r="2" fill="#EF4444" class="animate-pulse" />
    <circle cx="30" cy="15" r="2" fill="#10B981" />
    <circle cx="120" cy="35" r="2" fill="#FBBF24" />
    <circle cx="130" cy="35" r="2" fill="#10B981" />
    
    <!-- Glitching Bugs -->
    <text x="70" y="30" font-size="10" fill="#EF4444" font-family="monospace">&lt;ERR&gt;</text>
    <rect x="20" y="80" width="12" height="12" fill="#EF4444" />
    <rect x="23" y="83" width="6" height="2" fill="#000" />
    
    <rect x="120" y="80" width="12" height="12" fill="#EF4444" />
    <rect x="123" y="83" width="6" height="2" fill="#000" />
  </g>

      
      <!-- Scanning HUD Overlay -->
      <path d="M 700 130 L 730 130 L 730 160" fill="none" stroke="#EF4444" stroke-width="2" />
      <path d="M 950 130 L 920 130 L 920 160" fill="none" stroke="#EF4444" stroke-width="2" />
      <path d="M 700 270 L 730 270 L 730 240" fill="none" stroke="#EF4444" stroke-width="2" />
      <path d="M 950 270 L 920 270 L 920 240" fill="none" stroke="#EF4444" stroke-width="2" />
      <text x="825" y="125" class="label" fill="#EF4444" text-anchor="middle">TARGET LOCKED: CRITICAL BUGS</text>
    </svg>