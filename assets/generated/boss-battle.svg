<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
      
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', monospace;
      fill: #FFFFFF;
    }
    .title {
      font-size: 24px;
      fill: #FF6B35;
    }
    .subtitle {
      font-size: 14px;
      fill: #FFB703;
    }
    .stat-label {
      font-size: 10px;
      fill: #94A3B8;
    }
    .stat-value {
      font-size: 16px;
      fill: #06D6A0;
    }
    
    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes slideBg {
      from { background-position: 0 0; }
      to { background-position: 100% 0; }
    }
    
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-pulse { animation: pulse 2s steps(2, start) infinite; }
  </style>

      <rect width="800" height="200" fill="#0B1020" />
      
      <rect x="20" y="20" width="760" height="160" fill="#111827" stroke="#334155" stroke-width="4" />
      
      <text x="400" y="60" class="pixel-text title" text-anchor="middle" fill="#EF476F">WARNING: FINAL BOSS APPROACHING</text>
      
      <!-- Boss Sprite Placeholder (Skull/Fortress) -->
      <g transform="translate(100, 80)">
        <rect x="10" y="10" width="60" height="60" fill="#EF476F" />
        <rect x="20" y="20" width="10" height="10" fill="white" />
        <rect x="50" y="20" width="10" height="10" fill="white" />
        <rect x="25" y="50" width="30" height="10" fill="white" />
      </g>
      
      <!-- Boss Info & Health -->
      <g transform="translate(200, 100)">
        <text x="0" y="0" class="pixel-text" font-size="14" fill="#FFFFFF">GATE 2027 FORTRESS</text>
        <text x="0" y="20" class="pixel-text stat-label">HP:</text>
        
        <rect x="40" y="10" width="450" height="15" fill="#0B1020" stroke="#334155" stroke-width="2" />
        <!-- Animated Health Bar -->
        <rect x="42" y="12" height="11" fill="#EF476F">
          <animate attributeName="width" values="446;200;446" dur="5s" repeatCount="indefinite" />
        </rect>
        <text x="510" y="20" class="pixel-text stat-label">PREPARING...</text>
      </g>
    </svg>