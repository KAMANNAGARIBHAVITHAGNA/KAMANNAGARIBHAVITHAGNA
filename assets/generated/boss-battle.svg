<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
      
  
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    
    <!-- Stormy Sky Gradient -->
    <linearGradient id="stormGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    
    <!-- Grass Gradient -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>

    <!-- Wood Texture Gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Stone Gradient -->
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&amp;display=swap');
    
    text {
      font-family: 'Lilita One', sans-serif;
    }
    
    .hud-text {
      fill: #ffffff;
      font-size: 18px;
      paint-order: stroke;
      stroke: #000000;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .title-text {
      fill: #ffffff;
      font-size: 40px;
      paint-order: stroke;
      stroke: #000000;
      stroke-width: 8px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    
    @keyframes birdHover {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    
    @keyframes bossHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes lightning {
      0%, 95%, 100% { opacity: 0; }
      96%, 98% { opacity: 1; }
      97% { opacity: 0.5; }
    }
    
    @keyframes alertBlink {
      0%, 100% { fill: #ef4444; opacity: 0.8; }
      50% { fill: #fca5a5; opacity: 0.2; }
    }

    .animate-cloud { animation: cloudDrift 40s linear infinite; }
    .animate-bird { animation: birdHover 2s ease-in-out infinite; }
    .animate-boss { animation: bossHover 3s ease-in-out infinite; }
    .animate-lightning { animation: lightning 5s infinite; }
    .animate-alert { animation: alertBlink 1s infinite; }
  </style>

      
  <rect width="800" height="300" fill="url(#stormGrad)" />
  
  <!-- Distant Mountains -->
  <path d="M 0 300 L 150 150 L 300 300 Z" fill="#312e81" opacity="0.6" />
  <path d="M 200 300 L 400 100 L 600 300 Z" fill="#1e1b4b" opacity="0.5" />
  <path d="M 500 300 L 650 120 L 800 300 Z" fill="#3730a3" opacity="0.4" />
  
  <!-- Clouds -->
  <g class="animate-cloud" style="animation-duration: 45s;">
    <path d="M 100 80 Q 120 60 140 80 Q 160 70 170 90 Q 180 110 140 110 L 100 110 Q 80 110 80 90 Q 80 70 100 80 Z" fill="#475569" opacity="0.8" />
  </g>
  <g class="animate-cloud" style="animation-duration: 35s; animation-delay: -15s;">
    <path d="M 600 60 Q 620 40 640 60 Q 660 50 670 70 Q 680 90 640 90 L 600 90 Q 580 90 580 70 Q 580 50 600 60 Z" fill="#334155" opacity="0.6" transform="scale(1.5) translate(-200, -20)" />
  </g>

  <!-- Foreground Grass Hill -->
  <path d="M -50 300 Q 400 200 850 300 L 850 400 L -50 400 Z" fill="url(#grassGrad)" stroke="#166534" stroke-width="4" />

      
      <!-- Lightning -->
      <path d="M 600 0 L 580 80 L 620 90 L 550 250" fill="none" stroke="#fde047" stroke-width="6" filter="url(#glow)" class="animate-lightning" />
      
      <!-- Red Alert Overlay -->
      <rect width="800" height="300" class="animate-alert" style="mix-blend-mode: overlay;" />

      <text x="400" y="50" class="title-text" fill="#ef4444" text-anchor="middle" filter="url(#glow)">FINAL BOSS: GATE 2027</text>

      <!-- Giant Fortress -->
      <g transform="translate(250, 150)">
        
  <rect x="0" y="0" width="300" height="150" fill="url(#stoneGrad)" stroke="#334155" stroke-width="3" rx="2" filter="url(#dropShadow)" />

        <!-- Battlements -->
        
  <rect x="-20" y="-30" width="40" height="50" fill="url(#stoneGrad)" stroke="#334155" stroke-width="3" rx="2" filter="url(#dropShadow)" />

        
  <rect x="80" y="-30" width="40" height="50" fill="url(#stoneGrad)" stroke="#334155" stroke-width="3" rx="2" filter="url(#dropShadow)" />

        
  <rect x="180" y="-30" width="40" height="50" fill="url(#stoneGrad)" stroke="#334155" stroke-width="3" rx="2" filter="url(#dropShadow)" />

        
  <rect x="280" y="-30" width="40" height="50" fill="url(#stoneGrad)" stroke="#334155" stroke-width="3" rx="2" filter="url(#dropShadow)" />

        
        <!-- Danger signs -->
        <circle cx="150" cy="80" r="40" fill="#1e293b" />
        <path d="M 130 90 L 150 50 L 170 90 Z" fill="#ef4444" />
      </g>

      <!-- Giant Bug King -->
      <g transform="translate(400, 90)" class="animate-boss">
        <circle cx="0" cy="0" r="60" fill="#84cc16" stroke="#3f6212" stroke-width="4" filter="url(#dropShadow)" />
        <circle cx="-20" cy="-10" r="15" fill="#ffffff" />
        <circle cx="20" cy="-10" r="15" fill="#ffffff" />
        <circle cx="-20" cy="-10" r="5" fill="#ef4444" />
        <circle cx="20" cy="-10" r="5" fill="#ef4444" />
        <ellipse cx="0" cy="25" rx="25" ry="15" fill="#65a30d" stroke="#3f6212" stroke-width="3" />
        <path d="M -30 -60 L -10 -40 M 30 -60 L 10 -40" stroke="#3f6212" stroke-width="6" stroke-linecap="round" />
        <!-- Crown -->
        <path d="M -30 -60 L -40 -90 L -15 -75 L 0 -100 L 15 -75 L 40 -90 L 30 -60 Z" fill="#fbbf24" stroke="#b45309" stroke-width="3" />
      </g>

      <!-- Giant Boss Health Bar -->
      <g transform="translate(100, 70)">
        <rect width="600" height="24" rx="12" fill="#1e293b" stroke="#ffffff" stroke-width="3" filter="url(#dropShadow)" />
        <rect x="4" y="4" width="592" height="16" rx="8" fill="#ef4444" />
      </g>
    </svg>