<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
      
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&amp;display=swap');
    
    .game-text {
      font-family: 'Luckiest Guy', cursive;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    
    .hud-text {
      font-family: 'Luckiest Guy', cursive;
      fill: #ffffff;
      font-size: 16px;
      text-shadow: 2px 2px 0 #000;
    }
    
    .title-text {
      font-family: 'Luckiest Guy', cursive;
      font-size: 32px;
      fill: #ffffff;
      text-shadow: 3px 3px 0 #000;
    }

    @keyframes cloudMove {
      from { transform: translateX(100%); }
      to { transform: translateX(-100%); }
    }
    
    @keyframes birdBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.02); }
    }
    
    @keyframes bugJiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    
    @keyframes siren {
      0%, 100% { fill: #ef4444; opacity: 0.8; }
      50% { fill: #fca5a5; opacity: 0.2; }
    }
    
    .animate-cloud { animation: cloudMove 20s linear infinite; }
    .animate-bird { animation: birdBounce 2s ease-in-out infinite; transform-origin: center; }
    .animate-bug { animation: bugJiggle 1s ease-in-out infinite; transform-origin: center; }
    .animate-siren { animation: siren 1s infinite; }
  </style>

      <rect width="800" height="250" fill="#92400e" />
      <!-- Planks texture -->
      <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 0 200 L 800 200" stroke="#78350f" stroke-width="2" />
      
      <text x="400" y="50" class="title-text" text-anchor="middle">LEVEL COMPLETE</text>
      
      
      <g transform="translate(110, 120)">
        <!-- Chains -->
        <rect x="-40" y="-80" width="4" height="40" fill="#94a3b8" />
        <rect x="36" y="-80" width="4" height="40" fill="#94a3b8" />
        <!-- Wood Board -->
        <rect x="-60" y="-40" width="120" height="90" rx="10" fill="#d97706" stroke="#92400e" stroke-width="4" />
        <rect x="-50" y="-30" width="100" height="70" rx="5" fill="#fef3c7" opacity="0.3" />
        
        <text y="-10" class="game-text" font-size="14" text-anchor="middle" fill="#92400e">MobileHub</text>
        <text y="35" class="game-text" font-size="12" text-anchor="middle" fill="#15803d">CLEARED!</text>
        
        <!-- Stars -->
        <g transform="translate(0, 0)">
          <path d="M -30 10 L -25 25 L -10 25 L -20 35 L -15 50 L -30 40 L -45 50 L -40 35 L -50 25 L -35 25 Z" fill="#fbbf24" transform="scale(0.8) translate(15, -10)"/><path d="M 0 10 L 5 25 L 20 25 L 10 35 L 15 50 L 0 40 L -15 50 L -10 35 L -20 25 L -5 25 Z" fill="#fbbf24" transform="scale(0.8) translate(15, -10)"/><path d="M 30 10 L 35 25 L 50 25 L 40 35 L 45 50 L 30 40 L 15 50 L 20 35 L 10 25 L 25 25 Z" fill="#fbbf24" transform="scale(0.8) translate(15, -10)"/>
