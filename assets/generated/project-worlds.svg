            <!-- Star 1 -->
            <path d="M 15 0 L 20 10 L 30 10 L 22 18 L 25 28 L 15 22 L 5 28 L 8 18 L 0 10 L 10 10 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
            <!-- Star 2 -->
            <path d="M 45 -5 L 50 5 L 60 5 L 52 13 L 55 23 L 45 17 L 35 23 L 38 13 L 30 5 L 40 5 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
            <!-- Star 3 -->
            <path d="M 75 0 L 80 10 L 90 10 L 82 18 L 85 28 L 75 22 L 65 28 L 68 18 L 60 10 L 70 10 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
          </g>
          
